function localISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function parseDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12,0,0)}
function weekday(s){return parseDate(s).getDay()}
function weekSunday(s){const d=parseDate(s);d.setDate(d.getDate()-d.getDay());return d}
function weekDate(s,day){const d=weekSunday(s);d.setDate(d.getDate()+day);return localISO(d)}
function readable(s,opt={weekday:'short',month:'short',day:'numeric',year:'numeric'}){return parseDate(s).toLocaleDateString('en-GB',opt)}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v,d=0){const x=Number(v);return Number.isFinite(x)?x:d}
function fmt(n,dec=1){return num(n).toFixed(dec).replace(/\.0+$/,'')}
function load(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const x=JSON.parse(raw);if(x && x.version===1 && typeof x.sessions==='object' && Array.isArray(x.weights)){db={...clone(DEFAULTS),...x,settings:{...DEFAULTS.settings,...x.settings},sessions:x.sessions||{},weights:x.weights||[],steps:x.steps||{},custom:x.custom||{}}}}}catch(e){console.warn('Local storage unavailable:',e);setTimeout(()=>toast('Your browser is blocking local storage. Export backups frequently.'),1000)}}
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(db));document.getElementById('savedStatus').textContent='Saved on this device'}catch(e){document.getElementById('savedStatus').textContent='Storage blocked';toast('Storage was blocked. Please export a backup.')}}
function session(d=selectedDate){if(!db.sessions[d])db.sessions[d]={notes:'',done:false,items:{},savedAt:null};return db.sessions[d]}
function plannedItems(day){return (PLAN[day]?.items||[]).map(([id,a,b])=>({id,planA:a,planB:b,...EX[id]})).concat((db.custom[day]||[]).map(x=>({...x,draw:x.kind==='strength'?'shoulder':'tread',cues:['Use controlled form and an appropriate intensity.'],gear:'Custom',type:'Custom'})))}
function findItem(id,day=weekday(selectedDate)){return plannedItems(day).find(x=>x.id===id)}
function itemRecord(id,d=selectedDate){const s=session(d);if(!s.items[id]){const e=findItem(id,weekday(d));if(!e)return null;s.items[id]={done:false,minutes:e.kind==='cardio'?e.planA:'',distance:'',speed:'',incline:'',resistance:'',rpe:'',notes:'',sets:e.kind==='strength'?Array.from({length:e.planA},()=>({kg:'',reps:e.planB,done:false})):[]}}return s.items[id]}
function completedCount(d){const s=db.sessions[d],items=plannedItems(weekday(d));return items.reduce((a,x)=>a+(s?.items?.[x.id]?.done?1:0),0)}
function doneWorkouts(){return Object.entries(db.sessions).filter(([d,s])=>s?.done).sort((a,b)=>b[0].localeCompare(a[0]))}
function dayMinutes(d){const s=db.sessions[d];if(!s)return 0;return plannedItems(weekday(d)).reduce((acc,x)=>{const r=s.items?.[x.id];return acc+(r?.done&&x.kind==='cardio'?num(r.minutes):0)},0)}
function latestWeight(){const w=(db.weights||[]).filter(x=>num(x.kg)>0).sort((a,b)=>b.date.localeCompare(a.date));return w.length?num(w[0].kg):num(db.settings.startWeight)}
function weightDifference(){return num(db.settings.startWeight)-latestWeight()}
function weekCompleted(){return [0,1,2,3,4].filter(i=>db.sessions[weekDate(selectedDate,i)]?.done).length}
function weekCardio(){return [0,1,2,3,4].reduce((a,i)=>a+dayMinutes(weekDate(selectedDate,i)),0)}

function prevLog(id,date){const dates=Object.keys(db.sessions).filter(d=>d<date&&db.sessions[d]?.items?.[id]).sort().reverse();if(!dates.length)return '';const d=dates[0],r=db.sessions[d].items[id];let summary='';if(r.sets?.length){const recorded=r.sets.filter(s=>s.done||s.kg!==''&&s.kg!=null);summary=recorded.length?recorded.map(s=>`${fmt(s.kg)} kg × ${fmt(s.reps,0)}`).join(' / '):'No sets recorded'}else{summary=`${fmt(r.minutes)} min${r.distance?` · ${fmt(r.distance)} km`:''}`}return `<div class="inline-note" style="margin:0 0 13px"><strong>Last recorded · ${safe(readable(d,{day:'numeric',month:'short'}))}:</strong> ${safe(summary)}</div>`}
function renderExerciseBody(e,r){const id=e.id;let contents='';if(e.kind==='cardio'){contents=`<div class="fields">${inputfield(id,'minutes',r.minutes??e.planA,'Actual min','0.5','min')}${inputfield(id,'distance',r.distance??'','Distance (km)','0.01','optional')}${inputfield(id,'rpe',r.rpe??'','Effort /10','1','1–10')}${inputfield(id,'speed',r.speed??'','Speed km/h','0.1','optional')}</div><div class="fields three">${inputfield(id,'incline',r.incline??'','Incline %','0.5','optional')}${inputfield(id,'resistance',r.resistance??'','Resistance level','1','optional')}</div>`}else{const sets=r.sets||Array.from({length:e.planA},()=>({kg:'',reps:e.planB,done:false}));contents=`<table class="strength-grid"><thead><tr><th style="width:46px">SET</th><th>LOAD (KG)</th><th>REPS</th><th style="width:50px">DONE</th></tr></thead><tbody>${sets.map((set,j)=>`<tr><td>${j+1}</td><td><input type="number" min="0" max="1000" step="0.5" inputmode="decimal" data-set-field="kg" data-ex="${safe(id)}" data-index="${j}" value="${safe(set.kg??'')}" aria-label="Set ${j+1} weight in kg"></td><td><input type="number" min="0" max="100" step="1" inputmode="numeric" data-set-field="reps" data-ex="${safe(id)}" data-index="${j}" value="${safe(set.reps??e.planB)}" aria-label="Set ${j+1} repetitions"></td><td><input type="checkbox" data-set-check="${safe(id)}" data-index="${j}" ${set.done?'checked':''} aria-label="Complete set ${j+1}"></td></tr>`).join('')}</tbody></table><div class="tiny-hint">Dumbbell exercises: record kg <b>per dumbbell</b>. Machine: record the displayed weight. Check individual sets as you finish.</div>`}
return `<div class="exbody">${prevLog(id,selectedDate)}<div class="form-tip"><b>FORM:</b> ${safe(e.cues[0])}</div>${contents}<div class="field-group"><label for="note-${safe(id)}">Exercise notes</label><input id="note-${safe(id)}" data-exnote="${safe(id)}" type="text" placeholder="e.g. incline 6%, felt good, R/L balance..." value="${safe(r.notes||'')}"></div><div class="exfoot"><span class="tiny-hint">${safe(e.tip||'')}${e.kind==='cardio'?' Duration starts at the planned target — edit if you did less or more.':''}</span><button class="textbtn" data-guide="${safe(e.id)}">See illustrated guide ↗</button></div></div>`}
function renderWeek(){return `<h1 class="h1">Your five-day plan.</h1><p class="subtitle">Designed for your 3–4 PM office gym slot: three cardio-focused days and two mixed strength/cardio days. Friday and Saturday are recovery days.</p><div class="grid2">${[0,1,2,3,4].map(d=>{const p=PLAN[d];const items=plannedItems(d);return `<div class="card weekcard" data-open-day="${d}" role="button" tabindex="0"><div class="wkhead"><div><div class="eyebrow">${DAYS[d].toUpperCase()}</div><h3>${p.name}</h3></div><span class="chip">~${p.mins} min</span></div><div class="mini-art">${draw(items.find(i=>i.kind==='strength')?.draw||items[0].draw)}<div style="font-size:12px;color:var(--muted);line-height:1.5">${p.subtitle}</div></div><div class="week-bullets">${items.map(e=>`<div>• ${safe(e.name)} <span class="muted">${e.kind==='cardio'?`${e.planA} min`:`${e.planA}×${e.planB}`}</span></div>`).join('')}</div><div style="margin-top:13px;color:var(--lime);font-size:12px;font-weight:800">Open workout →</div></div>`}).join('')}</div><div class="inline-note"><strong>Rest days:</strong> Friday and Saturday. Short walks and light mobility are fine. Start with manageable intensity, progress gradually, and allow 60–90 seconds between strength sets.</div><div class="section-title"><h2>Research basis</h2></div><div class="card cardpad source-list">WHO recommends 150–300 minutes of moderate aerobic activity (or an equivalent vigorous amount) and muscle-strengthening work on 2+ days each week. This plan uses that pattern with your available machines.<br><a href="https://www.who.int/europe/publications/i/item/9789240014886" target="_blank" rel="noopener noreferrer">WHO physical activity guidelines ↗</a><br><a href="https://www.cdc.gov/physical-activity-basics/adding-adults/index.html" target="_blank" rel="noopener noreferrer">CDC adult activity guidance ↗</a><br><a href="${SOURCE_ACE}" target="_blank" rel="noopener noreferrer">ACE exercise library (photos and instructions) ↗</a></div>`}
function renderProgress(){const x=latestWeight(),remaining=Math.max(0,x-num(db.settings.goalWeight));let h=`<h1 class="h1">Evidence, not guesses.</h1><p class="subtitle">Log morning weight a few times weekly, compare trends, and record your steps and completed sessions. A single weigh-in can fluctuate with water, salt, and digestion.</p><div class="progresshero"><div class="card goalbox"><span class="eyebrow">WEIGHT TARGET</span><div class="goalval">${fmt(x)} <span style="font-size:16px;color:var(--muted)">kg</span></div><div class="small muted">${fmt(remaining)} kg remaining to ${fmt(db.settings.goalWeight)} kg</div><div class="progress-rail"><div class="progress-fill" style="width:${Math.max(0,Math.min(100,100*weightDifference()/Math.max(.1,db.settings.startWeight-db.settings.goalWeight)))}%"></div></div><div class="week-recap"><span class="chip">Start ${fmt(db.settings.startWeight)} kg</span><span class="chip ${weightDifference()>0?'good':''}">${weightDifference()>0?'−':''}${fmt(Math.abs(weightDifference()))} kg ${weightDifference()>=0?'down':'up'}</span></div></div><div class="card goalbox"><span class="eyebrow">THIS WEEK</span><div class="goalval">${weekCompleted()} <span style="font-size:16px;color:var(--muted)">/ 5 sessions</span></div><div class="small muted">${weekCardio()} recorded cardio minutes</div><div class="week-recap"><span class="chip">Target 5 gym days</span><span class="chip">Step goal ${num(db.settings.stepGoal).toLocaleString('en-US')}/day</span></div></div></div>`;
h+=`<div class="grid2"><div class="card cardpad"><h2 style="margin-top:0">Log body weight</h2><p class="muted small">Ideally in the morning, after using the bathroom, before breakfast.</p><form id="weightForm" class="field-row" style="align-items:end"><div class="field-group" style="flex:1;min-width:135px"><label>Date</label><input name="date" type="date" value="${localISO(new Date())}" required></div><div class="field-group" style="flex:1;min-width:100px"><label>Weight (kg)</label><input name="kg" inputmode="decimal" type="number" step="0.1" min="25" max="300" placeholder="86.5" required></div><button class="btn primary" type="submit">Save</button></form><div class="chartarea">${weightChart()}</div><div class="records">${db.weights.length?db.weights.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6).map(w=>`<div class="recordrow"><div><div>${safe(readable(w.date))}</div></div><div class="field-row"><span class="value">${fmt(w.kg)} kg</span><button class="btn sm ghost" data-del-weight="${safe(w.date)}" title="Delete weigh-in">×</button></div></div>`).join(''):'<div class="nodata">No weigh-ins yet. Your 86.5 kg starting value is a baseline, not a recorded measurement.</div>'}</div></div>`;
const steps=num(db.steps[selectedDate]);h+=`<div class="card cardpad"><h2 style="margin-top:0">Daily steps</h2><p class="muted small">Start around 5,000 per day. Gradually increase if comfortable.</p><form id="stepsForm" class="field-row" style="align-items:end"><div class="field-group" style="flex:1;min-width:140px"><label>Date</label><input name="date" type="date" value="${localISO(new Date())}" required></div><div class="field-group" style="flex:1;min-width:100px"><label>Steps</label><input name="steps" type="number" step="1" min="0" max="100000" inputmode="numeric" placeholder="5000" required></div><button class="btn primary" type="submit">Save</button></form><div style="margin-top:24px"><span class="label">Selected date · ${readable(selectedDate,{weekday:'short',day:'numeric',month:'short'})}</span><div class="goalval" style="font-size:31px;margin:8px 0">${steps.toLocaleString('en-US')} <span style="font-size:14px;color:var(--muted)">steps</span></div><div class="stepsbar"><div style="width:${Math.max(0,Math.min(100,100*steps/Math.max(1,num(db.settings.stepGoal))))}%"></div></div><div class="small muted">${Math.max(0,num(db.settings.stepGoal)-steps).toLocaleString('en-US')} steps until the daily goal</div></div><div class="section-title"><h2>Recent step logs</h2></div><div class="records">${Object.entries(db.steps).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,7).map(([d,v])=>`<div class="recordrow"><span>${safe(readable(d))}</span><strong>${num(v).toLocaleString('en-US')}</strong></div>`).join('')||'<div class="nodata">No steps recorded yet.</div>'}</div></div></div>`;
const completed=doneWorkouts();h+=`<div class="section-title"><h2>Workout history</h2><span class="mutedline">${completed.length} completed workouts</span></div><div class="card cardpad">${completed.length?completed.slice(0,25).map(([d,s])=>`<div class="recordrow"><div><div class="value">${safe(DAYS[weekday(d)])} · ${safe(PLAN[weekday(d)]?.name||'Workout')}</div><div class="sub">${safe(readable(d))} · ${completedCount(d)} exercises · ${dayMinutes(d)} cardio min</div></div><button class="btn sm" data-history-date="${safe(d)}">Open</button></div>`).join(''):'<div class="nodata">Your completed gym sessions will appear here once you press “Finish workout.”</div>'}</div>`;return h}
function weightChart(){const raw=db.weights.slice().filter(x=>Number.isFinite(+x.kg)).sort((a,b)=>a.date.localeCompare(b.date)).slice(-18);if(raw.length===0)return `<div class="nodata" style="margin:40px 10px">Your weight trend chart will appear after your first recorded weigh-in.</div>`;const vals=raw.map(x=>num(x.kg)),lo=Math.floor(Math.min(...vals,num(db.settings.goalWeight))-1),hi=Math.ceil(Math.max(...vals,num(db.settings.startWeight))+1),range=Math.max(2,hi-lo),W=520,H=220,pad={l:36,r:18,t:21,b:32},X=i=>pad.l+(raw.length===1?(W-pad.l-pad.r)/2:i*(W-pad.l-pad.r)/(raw.length-1)),Y=n=>pad.t+(hi-n)*(H-pad.t-pad.b)/range;
const grid=[0,.25,.5,.75,1].map(f=>{const v=lo+f*range;return `<line x1="${pad.l}" y1="${Y(v)}" x2="${W-pad.r}" y2="${Y(v)}" stroke="#37505a" stroke-dasharray="4 6"/><text x="${pad.l-7}" y="${Y(v)+4}" text-anchor="end" fill="#9ab4b7" font-size="11">${fmt(v)}</text>`}).join('');const pts=raw.map((w,i)=>`${X(i)},${Y(num(w.kg))}`).join(' ');return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight history chart"><title>Recorded body weight over time</title>${grid}<line x1="${pad.l}" y1="${Y(num(db.settings.goalWeight))}" x2="${W-pad.r}" y2="${Y(num(db.settings.goalWeight))}" stroke="#a3da79" stroke-dasharray="7 5" opacity=".75"/><text x="${W-pad.r}" y="${Math.max(12,Y(num(db.settings.goalWeight))-5)}" text-anchor="end" fill="#bff58d" font-size="10">GOAL</text><polyline fill="none" stroke="#7bdce7" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" points="${pts}"/>${raw.map((w,i)=>`<circle cx="${X(i)}" cy="${Y(num(w.kg))}" r="5" fill="#c7ff6b" stroke="#123031" stroke-width="2"><title>${safe(w.date)}: ${fmt(w.kg)} kg</title></circle>`).join('')}<text x="${pad.l}" y="${H-5}" font-size="11" fill="#9ab4b7">${safe(raw[0].date.slice(5))}</text><text x="${W-pad.r}" y="${H-5}" text-anchor="end" font-size="11" fill="#9ab4b7">${safe(raw[raw.length-1].date.slice(5))}</text></svg>`}
function renderGuide(){const all=Object.entries(EX).filter(([id,e])=>(e.name+' '+e.gear+' '+e.type).toLowerCase().includes(filterTerm.toLowerCase()));return `<h1 class="h1">Know every movement.</h1><p class="subtitle">Original, simplified exercise diagrams and quick technique cues built into this file. For detailed exercise photos, the guide includes links to the ACE exercise library where available. Diagrams are illustrative, not a substitute for coaching.</p><div class="libraryfilter"><input type="search" id="guideSearch" placeholder="Search exercise or equipment..." value="${safe(filterTerm)}" aria-label="Search exercises"><button class="btn" data-action="reset-search">Clear</button></div><div class="libgrid">${all.map(([id,e])=>`<button class="libcard" data-guide="${safe(id)}"><div class="libart">${draw(e.draw)}</div><h3>${safe(e.name)}</h3><p>${safe(e.gear)} · ${safe(e.type)}</p></button>`).join('')}</div>${all.length?'':'<div class="nodata">No exercises match your search.</div>'}`}
function renderSettings(){return `<h1 class="h1">Your settings & backup.</h1><p class="subtitle">Customize your goals. Your logs stay in this browser on this device — they are not synchronized between phones, browsers, or computers. Export a backup regularly.</p><div class="settings-grid"><div class="card setting"><h3>Personal targets</h3><p>These are tracking targets, not medical instructions.</p><form id="settingsForm" class="settings-form"><div class="field-group"><label>Starting weight (kg)</label><input name="startWeight" type="number" min="30" max="300" step="0.1" value="${safe(db.settings.startWeight)}" required></div><div class="field-group"><label>Goal weight (kg)</label><input name="goalWeight" type="number" min="30" max="300" step="0.1" value="${safe(db.settings.goalWeight)}" required></div><div class="field-group"><label>Height (cm)</label><input name="height" type="number" min="100" max="250" step="0.1" value="${safe(db.settings.height)}" required></div><div class="field-group"><label>Daily step goal</label><input name="stepGoal" type="number" min="500" max="50000" step="100" value="${safe(db.settings.stepGoal)}" required></div><button class="btn primary" style="grid-column:1/-1" type="submit">Save settings</button></form></div><div class="card setting"><h3>Protect your training records</h3><p>Save a JSON backup to move your logs to another device. CSV is useful for Excel or Google Sheets.</p><div class="field-row" style="margin:15px 0"><button class="btn primary" data-action="export-json">↓ Backup JSON</button><button class="btn" data-action="export-csv">↓ Export CSV</button></div><div class="field-group"><label for="importFile">Restore previously exported JSON</label><input id="importFile" type="file" accept=".json,application/json"></div><p>Restore replaces the current local records after confirmation. Export your current data first.</p><div class="field-row"><button class="btn danger" data-action="erase-data">Erase all records</button></div></div></div><div class="card cardpad" style="margin-top:17px"><h3 style="margin-top:0">Install Momentum on your phone</h3><p class="muted small" style="line-height:1.8">Open the hosted app in Chrome on Android and use <b>Install</b> or Chrome menu → <b>Add to Home screen</b>. On iPhone, open the hosted site and use Share → <b>Add to Home Screen</b>. Once installed, the app starts from its own icon and works offline after the first successful online visit. Installation requires HTTPS hosting; opening <code>index.html</code> directly from a file manager is only a browser preview.</p><button class="btn primary" data-action="install-app">↓ Install app / instructions</button></div><div class="card cardpad" style="margin-top:17px"><h3 style="margin-top:0">About this tracker</h3><p class="muted small" style="line-height:1.8">Installable offline-first web app · No internet required for the tracker or its built-in diagrams · All records are stored with your browser's localStorage. Clearing browser data, opening in another browser, or using some private/incognito modes may lose records. JSON export is the reliable backup. Use the same browser each time. Real workout performance matters more than estimated calorie-burn numbers, so this app deliberately does not invent calorie totals.</p><details class="helpdetails"><summary>Exercise & activity references</summary><p>World Health Organization: <a href="https://www.who.int/europe/publications/i/item/9789240014886" target="_blank" rel="noopener noreferrer">Physical activity guidelines</a>. CDC: <a href="https://www.cdc.gov/physical-activity-basics/adding-adults/index.html" target="_blank" rel="noopener noreferrer">Adult physical activity</a>. ACE: <a href="${SOURCE_ACE}" target="_blank" rel="noopener noreferrer">Exercise library</a>. Illustrations are original simplified diagrams created for this app.</p></details></div>`}
function guide(id){const e=EX[id]||findItem(id);if(!e)return;modalKey=id;document.getElementById('modalRoot').innerHTML=`<div class="modalbg" data-close-outside="1"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modalhead"><div><div class="eyebrow">EXERCISE GUIDE · ${safe(e.gear)}</div><h2 id="modal-title">${safe(e.name)}</h2></div><button class="roundbtn" data-action="close-modal" aria-label="Close guide">×</button></div><div class="guide-art">${draw(e.draw)}</div><p><strong>Technique checklist</strong></p><ol class="guide-cues">${(e.cues||[]).map(t=>`<li>${safe(t)}</li>`).join('')}</ol><div class="inline-note"><strong>Intensity:</strong> ${safe(e.tip||'Use comfortable, controlled movements.')}</div><div class="modalactions">${e.link?`<a class="btn" href="${e.link}" target="_blank" rel="noopener noreferrer">ACE detailed guide ↗</a>`:`<a class="btn" href="${SOURCE_ACE}" target="_blank" rel="noopener noreferrer">ACE exercise library ↗</a>`}<button class="btn primary" data-action="close-modal">Got it</button></div></div></div>`}
function closeModal(){modalKey=null;document.getElementById('modalRoot').innerHTML=''}
function addExerciseModal(){document.getElementById('modalRoot').innerHTML=`<div class="modalbg" data-close-outside="1"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modalhead"><div><div class="eyebrow">CUSTOMIZE WORKOUT</div><h2 id="modal-title">Add an exercise</h2></div><button class="roundbtn" data-action="close-modal">×</button></div><form id="addExerciseForm"><div class="field-group" style="margin:10px 0"><label>Exercise name</label><input name="name" required maxlength="65" placeholder="e.g. Rope triceps press-down" autofocus></div><div class="fields three"><div class="field-group"><label>Type</label><select name="kind" id="customKind"><option value="strength">Strength</option><option value="cardio">Cardio</option></select></div><div class="field-group"><label>Sets or minutes</label><input name="a" type="number" min="1" max="120" value="3" required></div><div class="field-group"><label>Reps (strength)</label><input name="b" type="number" min="1" max="100" value="12" required></div></div><div class="modalactions"><button class="btn" type="button" data-action="close-modal">Cancel</button><button class="btn primary" type="submit">Add exercise</button></div></form></div></div>`}
function toast(msg){const root=document.getElementById('toastRoot');root.innerHTML=`<div class="toast" role="status">${safe(msg)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>root.innerHTML='',3100)}
function saveInput(el){if(el.dataset.exinput){const r=itemRecord(el.dataset.exinput);if(!r)return;const key=el.dataset.key;const max=key==='rpe'?10:100000;if(el.value!==''&&(num(el.value)<0||num(el.value)>max)){toast('Check the entered value');return}r[key]=el.value;persist()}else if(el.dataset.setField){const r=itemRecord(el.dataset.ex);if(!r)return;r.sets[+el.dataset.index][el.dataset.setField]=el.value;persist()}else if(el.dataset.exnote){const r=itemRecord(el.dataset.exnote);r.notes=el.value;persist()}else if(el.dataset.sessionNote){session().notes=el.value;persist()}}
function download(name,text,type='application/json'){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function backup(){download(`momentum-gym-backup-${localISO(new Date())}.json`,JSON.stringify(db,null,2));toast('Backup file generated')}
function csv(){const rows=[['date','day','session_finished','exercise','type','exercise_completed','minutes','distance_km','speed_kmh','incline_pct','resistance','rpe','set','kg','reps','set_done','notes']];for(const [d,s]of Object.entries(db.sessions).sort(([a],[b])=>a.localeCompare(b))){for(const e of plannedItems(weekday(d))){const r=s.items?.[e.id];if(!r)continue;const base=[d,DAYS[weekday(d)],!!s.done,e.name,e.kind,!!r.done,r.minutes??'',r.distance??'',r.speed??'',r.incline??'',r.resistance??'',r.rpe??''];if(e.kind==='strength'){(r.sets||[]).forEach((set,i)=>rows.push([...base,i+1,set.kg,set.reps,!!set.done,r.notes||'']))}else rows.push([...base,'','','','',r.notes||''])}}rows.push([]);rows.push(['date','weight_kg']);for(const x of db.weights)rows.push([x.date,x.kg]);rows.push([]);rows.push(['date','steps']);for(const [d,v]of Object.entries(db.steps))rows.push([d,v]);download(`momentum-gym-records-${localISO(new Date())}.csv`,rows.map(row=>row.map(v=>{let s=String(v??'');if(/^[=+@]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'}).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('CSV file generated')}
function validateImport(x){return x && x.version===1 && x.settings && typeof x.settings==='object' && x.sessions && typeof x.sessions==='object' && !Array.isArray(x.sessions) && Array.isArray(x.weights) && x.weights.length<20000 && Object.keys(x.sessions).length<10000}
function doFinish(){const w=weekday(selectedDate),all=plannedItems(w);if(!PLAN[w])return;const s=session(),n=completedCount(selectedDate);if(n===0&&!confirm('No exercises are marked complete. Finish this workout anyway?'))return;if(n<all.length&&!confirm(`Only ${n} of ${all.length} exercises are marked complete. Save this workout as finished anyway?`))return;s.done=true;s.savedAt=new Date().toISOString();persist();render();toast('Workout saved to history')}
function renderTimer(){const root=document.getElementById('timerRoot');if(!restTimer.deadline){root.innerHTML='';return}const remain=Math.max(0,Math.ceil((restTimer.deadline-Date.now())/1000));if(remain<=0){restTimer.deadline=null;root.innerHTML='';if('vibrate'in navigator)try{navigator.vibrate([150,100,150])}catch(_){}toast('Rest complete — next set');return}root.innerHTML=`<div class="timerdock" aria-live="off"><span style="font-size:11px;font-weight:800">REST</span><strong>${Math.floor(remain/60)}:${String(remain%60).padStart(2,'0')}</strong><button data-action="stop-timer">Stop</button></div>`}
function resetData(){if(!confirm('Erase ALL workouts, weights, steps and custom exercises stored in this browser? This cannot be undone without a backup.'))return;if(!confirm('Confirm permanent erasure of local records?'))return;db=clone(DEFAULTS);persist();go('today');toast('Local records erased')}
function setDateDay(day){selectedDate=weekDate(selectedDate,day);expanded=null;render()}
function updateNavDay(d){selectedDate=d;expanded=null;render()}
function eventClick(e){const el=e.target.closest('[data-tab],[data-day],[data-expand],[data-guide],[data-action],[data-open-day],[data-history-date],[data-del-weight]');if(!el)return;if(el.dataset.tab){go(el.dataset.tab);return}if(el.dataset.day!==undefined){setDateDay(+el.dataset.day);return}if(el.dataset.expand){expanded=expanded===el.dataset.expand?null:el.dataset.expand;render();return}if(el.dataset.guide){guide(el.dataset.guide);return}if(el.dataset.openDay!==undefined){setDateDay(+el.dataset.openDay);go('today');return}if(el.dataset.historyDate){selectedDate=el.dataset.historyDate;go('today');return}if(el.dataset.delWeight){if(confirm('Delete the weigh-in for '+el.dataset.delWeight+'?')){db.weights=db.weights.filter(x=>x.date!==el.dataset.delWeight);persist();render()}return}const a=el.dataset.action;if(!a)return;if(a==='settings')go('settings');else if(a==='rest'){restTimer.deadline=Date.now()+num(el.dataset.sec,60)*1000;renderTimer();toast('Rest timer started')}else if(a==='stop-timer'){restTimer.deadline=null;renderTimer()}else if(a==='close-modal')closeModal();else if(a==='finish-session')doFinish();else if(a==='add-exercise')addExerciseModal();else if(a==='reset-search'){filterTerm='';render()}else if(a==='export-json')backup();else if(a==='export-csv')csv();else if(a==='erase-data')resetData()}
document.addEventListener('click',eventClick);
document.addEventListener('click',e=>{if(e.target.matches('[data-close-outside]'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-open-day]')){e.preventDefault();const day=+e.target.dataset.openDay;setDateDay(day);go('today')}});
document.addEventListener('change',e=>{const x=e.target;if(x.id==='chosenDate'){if(/^\d{4}-\d{2}-\d{2}$/.test(x.value))updateNavDay(x.value)}else if(x.dataset.complete){itemRecord(x.dataset.complete).done=x.checked;persist();render()}else if(x.dataset.setCheck){const r=itemRecord(x.dataset.setCheck);r.sets[+x.dataset.index].done=x.checked;if(r.sets.every(set=>set.done))r.done=true;else if(!x.checked)r.done=false;persist();render()}else if(x.id==='importFile'&&x.files[0]){const file=x.files[0];if(file.size>10_000_000){toast('Backup file too large');return}const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);if(!validateImport(x))throw Error('Unexpected file structure');if(confirm('Replace ALL current local records with this backup? Please back up current data first.')){db={...clone(DEFAULTS),...x,settings:{...DEFAULTS.settings,...x.settings}};db.custom=db.custom||{};db.steps=db.steps||{};persist();go('today');toast('Backup restored successfully')}}catch(err){toast('Invalid or unsupported backup file')}};reader.readAsText(file);x.value=''}else if(x.dataset.exinput||x.dataset.setField||x.dataset.exnote||x.dataset.sessionNote)saveInput(x)});
document.addEventListener('input',e=>{const x=e.target;if(x.dataset.exinput||x.dataset.setField||x.dataset.exnote||x.dataset.sessionNote)saveInput(x);else if(x.id==='guideSearch'){filterTerm=x.value;const pos=x.selectionStart;render();const next=document.getElementById('guideSearch');next.focus();next.setSelectionRange(pos,pos)}});
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target;if(form.id==='weightForm'){const f=new FormData(form),date=String(f.get('date')),kg=num(f.get('kg'));if(kg<25||kg>300)return toast('Enter a valid body weight');db.weights=db.weights.filter(x=>x.date!==date);db.weights.push({date,kg});db.weights.sort((a,b)=>a.date.localeCompare(b.date));persist();render();toast('Body weight saved')}else if(form.id==='stepsForm'){const f=new FormData(form),date=String(f.get('date')),steps=Math.round(num(f.get('steps')));if(steps<0||steps>100000)return toast('Enter a valid step count');db.steps[date]=steps;selectedDate=date;persist();render();toast('Daily steps saved')}else if(form.id==='settingsForm'){const f=new FormData(form),a=Object.fromEntries([...f].map(([k,v])=>[k,num(v)]));if(a.startWeight<=0||a.goalWeight<=0||a.height<=0||a.stepGoal<500)return toast('Check your target values');db.settings={...db.settings,...a};persist();render();toast('Settings updated')}else if(form.id==='addExerciseForm'){const f=new FormData(form),day=weekday(selectedDate),name=String(f.get('name')).trim(),kind=String(f.get('kind')),a=num(f.get('a')),b=num(f.get('b'));if(!PLAN[day]||!name||a<1||a>120||b<1||b>100)return toast('Check your exercise inputs');if(!db.custom[day])db.custom[day]=[];const id='custom-'+Date.now();db.custom[day].push({id,name,kind,planA:a,planB:b});persist();closeModal();expanded=id;render();toast('Custom exercise added')}});

// Installable PWA behavior. The workout tracker remains usable even without PWA APIs.
let pendingInstallPrompt=null;
const alreadyInstalled=()=>window.matchMedia('(display-mode: standalone)').matches||Boolean(navigator.standalone);
function updateInstallButton(){const b=document.getElementById('installButton');if(!b)return;b.style.display=alreadyInstalled()?'none':'';}
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();pendingInstallPrompt=event;updateInstallButton()});
window.addEventListener('appinstalled',()=>{pendingInstallPrompt=null;updateInstallButton();toast('Momentum installed successfully')});
function installInstructions(){
 let msg;
 if(location.protocol==='file:')msg='You opened the app from a downloaded file. To install it as a phone app, the folder must first be hosted on an HTTPS website (for example GitHub Pages). You can still use this file in the browser, but this file-only version cannot install itself.';
 else if(location.protocol==='http:' && !['localhost','127.0.0.1'].includes(location.hostname))msg='Installation needs an HTTPS address. Host the app on GitHub Pages or another HTTPS host.';
 else if(/iPhone|iPad|iPod/i.test(navigator.userAgent))msg='On iPhone: open this page in your mobile browser, tap Share, then Add to Home Screen.';
 else msg='On Android: open this HTTPS site in Chrome or Samsung Internet, tap the browser menu and choose Install app or Add to Home screen. If installation is not yet offered, refresh the page once and try again.';
 document.getElementById('modalRoot').innerHTML=`<div class="modalbg" data-close-outside="1"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modalhead"><div><div class="eyebrow">MOMENTUM GYM</div><h2 id="modal-title">Install on your phone</h2></div><button class="roundbtn" data-action="close-modal" aria-label="Close install instructions">×</button></div><p>${safe(msg)}</p><div class="inline-note"><strong>Private data:</strong> All records are stored locally. If you used the older HTML tracker, export its JSON backup from Settings and import that backup here. Installation does not transfer records from another browser or file.</div><button class="btn primary" data-action="close-modal">Got it</button></div></div>`;
}
async function installApp(){
 if(alreadyInstalled()){toast('Momentum is already installed');return}
 if(pendingInstallPrompt){const prompt=pendingInstallPrompt;pendingInstallPrompt=null;try{await prompt.prompt();const choice=await prompt.userChoice;if(choice?.outcome==='accepted')toast('App installation requested');else toast('You can install later from the browser menu')}catch(e){installInstructions()}return}
 installInstructions();
}
if('serviceWorker' in navigator && ['https:','http:'].includes(location.protocol)){
 window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(e=>console.info('Offline service worker unavailable:',e))});
}
updateInstallButton();

load();render();setInterval(renderTimer,250);
</script>
</body>
</html>
